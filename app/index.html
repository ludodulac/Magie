<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magie — Grimoire vivant</title>
<style>
:root{--bg:#f6f0df;--ink:#2b251f;--paper:#fffaf0;--line:#d8c9aa;--accent:#6f5b37;--shadow:0 10px 30px rgba(62,47,30,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Georgia,'Times New Roman',serif;background:linear-gradient(180deg,#efe4c9 0,#f8f3e7 35%,#f4eddd 100%);color:var(--ink)}
.hero{max-width:980px;margin:auto;padding:52px 20px 28px;text-align:center}.eyebrow{letter-spacing:.22em;font-size:.78rem;font-weight:700}.hero h1{font-size:clamp(2.2rem,6vw,4.5rem);line-height:.95;margin:.3rem 0 1rem}.hero>p:not(.eyebrow){max-width:700px;margin:0 auto 22px;font-size:1.08rem;line-height:1.6}.hero input{width:min(100%,650px);padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,250,240,.96);font:inherit;box-shadow:var(--shadow)}
main{max-width:1080px;margin:auto;padding:12px 20px 60px}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 34px}.category{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:18px 12px;cursor:pointer;font:inherit;min-height:92px;box-shadow:var(--shadow);transition:.15s transform,.15s background,.15s border-color}.category:hover{transform:translateY(-2px)}.category.active{background:#f0e2bd;border:2px solid var(--accent);transform:translateY(-2px)}.category .icon{display:block;font-size:1.6rem;margin-bottom:7px}.category .small{display:block;font-size:.75rem;opacity:.65;margin-top:5px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-title h2{font-size:1.8rem;margin-bottom:8px}.status{margin:0 0 18px;opacity:.72}.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;cursor:pointer;font:inherit}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:rgba(255,250,240,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:.15s transform,.15s border-color}.card:hover{transform:translateY(-2px);border-color:#b9a070}.card h3{margin:.35rem 0 .7rem;font-size:1.25rem}.card p{line-height:1.55}.tag{display:inline-block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.level{font-weight:700;opacity:.72;margin:.6rem 0 0}.note{font-style:italic;opacity:.78}.details{display:none;border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}.card.open .details{display:block}.openhint{font-size:.82rem;opacity:.62;margin-top:12px}.card.open .openhint{display:none}.pulse{animation:pulse .35s ease}@keyframes pulse{50%{transform:scale(.99)}}footer{text-align:center;padding:26px 20px 40px;opacity:.7;font-size:.9rem}@media(max-width:600px){.hero{padding-top:36px}.categories{grid-template-columns:repeat(2,1fr)}.section-title{align-items:flex-end}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="hero">
<p class="eyebrow">GRIMOIRE VIVANT</p>
<h1>Magie de l’âme qui agit</h1>
<p>Choisis une porte du grimoire. Pour suivre l’apprentissage dans l’ordre, ouvre « Parcours de l’école ».</p>
<input id="search" type="search" placeholder="Chercher : bonjour, arbre, bénédiction…" autocomplete="off">
</header>
<main>
<section id="categories" class="categories" aria-label="Catégories"></section>
<section id="results">
<div class="section-title"><h2 id="sectionHeading">Toutes les fiches</h2><button id="showAll" class="ghost" type="button">Tout afficher</button></div>
<p id="status" class="status"></p>
<div id="cards" class="cards"></div>
</section>
</main>
<footer>Laboratoire du grimoire — progression, exercices et sources sont conservés et enrichis sans perdre les idées déjà classées.</footer>
<script>
(function(){
const categories=[['parcours','🧙','Parcours de l’école'],['lecons','📖','Leçons'],['paroles','✨','Paroles'],['gestes','👐','Gestes'],['espaces','🚪','Lieux & seuils'],['visible','🌿','Êtres visibles'],['invisible','🌙','Êtres invisibles'],['elements','🔥','Éléments'],['alchimie','💠','Alchimie intérieure'],['contes','🗺️','Contes'],['sources','🧭','Sources & idées']];
const entries=[
{cat:'parcours',level:1,title:'Je me réveille — École de la présence',text:'Avant toute magie : apprendre à être là. Regarder, écouter, sentir sa respiration naturelle et accomplir un geste simple avec attention.',more:'Fiches : les trois secondes du magicien ; le premier regard du matin ; dix pas en étant présent. Passage : quand je suis présent, je commence à remarquer les êtres autour de moi.'},
{cat:'parcours',level:2,title:'Je reconnais — École de l’amitié',text:'Première grande loi : avant de demander ou transformer, se faire des amis. Première parole magique : Bonjour.',more:'Fiches : dire bonjour pour de vrai ; choisir un arbre ami ; observer un animal sans le déranger ; carnet des nouveaux amis. Passage : reconnaître les êtres conduit à reconnaître ce qu’ils nous donnent.'},
{cat:'parcours',level:3,title:'Je reçois — École de la gratitude',text:'Deuxième parole magique : Merci. Apprendre à voir les dons, les échanges et l’origine des choses.',more:'Fiches : trois mercis du matin ; le verre d’eau ; le voyage secret d’une bouchée ; remercier un objet qui nous sert. Passage : recevoir consciemment donne envie de répondre au monde par quelque chose de bon.'},
{cat:'parcours',level:4,title:'Je souhaite du bien — École du cœur',text:'Troisième parole magique : Je t’aime, comprise comme souhaiter du bien sans posséder.',more:'Fiches : le regard doux ; le cadeau que personne ne voit ; bénir en silence ; bénédiction de la forêt. Passage : aimer vraiment suppose de respecter la liberté et les limites.'},
{cat:'parcours',level:5,title:'Je demande — École des frontières',text:'Quatrième parole magique : Je t’en prie. Comprendre seuil, permission, intimité, territoire et consentement.',more:'Fiches : la magie du seuil ; frapper avant d’entrer ; demander à emprunter ; entrer dans une forêt comme chez quelqu’un. Passage : comprendre les frontières permet de prendre soin d’un espace.'},
{cat:'parcours',level:6,title:'J’habite — École de la maison',text:'Passer de « j’occupe un espace » à « je prends soin d’un espace ». Apprendre à devenir soi-même une présence accueillante.',more:'Fiches : faire respirer sa chambre ; saluer une maison ; bénir un lieu et ses habitants ; devenir une maison. Passage : une maison nous conduit aux matières, au vivant et aux éléments.'},
{cat:'parcours',level:7,title:'Je fais alliance — École de la nature et des éléments',text:'Rencontrer pierres, arbres, eau, air, terre et feu par l’observation, le respect, l’expérience sensible et l’imaginaire.',more:'Fiches : la leçon de la pierre ; le journal d’un arbre ; voir l’invisible par les traces du vent ; l’eau qui s’adapte ; ce que le feu transforme. Toujours distinguer observation, symbole, tradition et fiction.'},
{cat:'parcours',level:8,title:'Je transforme — École de l’alchimie intérieure',text:'La première matière du magicien est sa manière de penser, sentir, regarder, parler et agir.',more:'Fiches : le bouton pause du magicien ; un nuage n’est pas le ciel ; le gardien de la tour ; le nouveau chemin ; transformer la colère en courage utile.'},
{cat:'parcours',level:9,title:'Je bénis — École du rayonnement',text:'Agir sans domination : laisser derrière soi une qualité bénéfique, et unir intention intérieure et action réelle.',more:'Fiches : le cadeau invisible ; laisser une forêt plus heureuse ; préparer une pièce pour quelqu’un ; l’empreinte du magicien ; une pensée + un geste.'},
{cat:'parcours',level:10,title:'Je réponds de ma magie — École du magicien',text:'Réunir tout le parcours : respect, discernement, réparation, responsabilité et choix conscient de ce que l’on fait rayonner.',more:'Épreuve finale possible : un objet merveilleux ne répond pas à la volonté de pouvoir ; il révèle seulement la qualité réellement développée par le héros.'},
{cat:'lecons',title:'Se faire des amis',text:'Première leçon du grimoire : avant de vouloir agir sur le monde, apprendre à reconnaître les êtres et à entrer en relation avec eux.',note:'Noyau fondateur du livre.',more:'Commencer par saluer, observer, remercier et apprendre à connaître avant de demander quoi que ce soit.'},
{cat:'paroles',title:'Bonjour',text:'Dire bonjour comme un acte de reconnaissance : je vois qu’une présence est là.',note:'Première parole magique.',more:'À explorer avec les humains, les animaux, les arbres, un lieu ou un nouveau jour.'},
{cat:'paroles',title:'Merci',text:'Recevoir consciemment ce qui est donné et faire de la gratitude une force quotidienne.',more:'Exercice possible : choisir trois choses très simples à remercier chaque matin.'},
{cat:'paroles',title:'Je t’aime',text:'Parole d’ouverture du cœur : souhaiter du bien sans chercher à posséder.',more:'Dans le grimoire, l’amour peut devenir une qualité de présence plutôt qu’une formule de pouvoir.'},
{cat:'paroles',title:'Je t’en prie',text:'Demander sans contraindre, en respectant l’autre et ses frontières.',more:'Cette parole ouvre le thème du consentement, des seuils et du respect des espaces.'},
{cat:'gestes',title:'Bénir en silence',text:'Souhaiter du bien à un être ou à un lieu, même s’il ne sait pas qu’on le fait.',note:'Un des grands axes du grimoire.',more:'La bénédiction n’exige ni récompense ni possession : elle consiste d’abord à souhaiter le bien.'},
{cat:'gestes',title:'Le bouton pause du magicien',text:'Si un geste commence dans l’agitation ou la colère, s’arrêter avant de continuer puis recommencer sur un autre rythme.',note:'Adaptation jeunesse d’un exercice trouvé dans les notes Aïvanhov.',more:'Très bonne fiche d’alchimie intérieure : elle relie corps, émotion et choix sans demander de croire à une théorie particulière.'},
{cat:'gestes',title:'Les dix pas du présent',text:'Marcher dix pas en remarquant les appuis, les sons et ce que l’on voit, sans chercher à aller vite.',note:'Adaptation de la marche consciente.',more:'À placer tout au début du parcours comme entraînement de présence.'},
{cat:'espaces',title:'Entrer dans un lieu',text:'Avant d’entrer, observer le seuil, l’atmosphère, les limites et les habitants. Apprendre à ne pas traverser un espace comme s’il était vide.',more:'On pourra en faire une leçon entière sur les portes, les frontières et la manière de demander intérieurement la permission.'},
{cat:'espaces',title:'Devenir une maison',text:'Apprendre à devenir intérieurement un espace accueillant, stable et vivant dans lequel les autres peuvent respirer.',more:'Idée centrale : avant de construire un espace magique autour de soi, devenir soi-même un espace habitable.'},
{cat:'visible',title:'Cercle des amis visibles',text:'Humains, animaux, arbres, plantes, pierres, montagnes, rivières et lieux peuvent devenir des compagnons d’observation et de relation.',more:'Chaque règne pourra avoir ses signes, exercices, histoires et pages de dessin.'},
{cat:'visible',title:'La leçon de la pierre',text:'Observer une pierre ou un rocher : décrire ses qualités réelles, puis imaginer quelle vertu il pourrait symboliser.',note:'Adaptation du dialogue avec le rocher trouvé dans les notes.',more:'Permet de relier observation concrète et langage symbolique sans les confondre.'},
{cat:'invisible',title:'Cercle des amis invisibles',text:'Catégorie de recherche pour les êtres et présences du monde invisible dans l’univers fantasy du livre.',note:'À distinguer clairement entre sources spirituelles, symboles et fiction.',more:'Cette partie servira de bestiaire et de carte d’univers, avec une indication claire de la provenance de chaque figure.'},
{cat:'elements',title:'Les quatre éléments',text:'Terre, eau, air et feu comme grandes portes d’expérience, d’observation et d’imaginaire.',more:'Chaque élément pourra réunir sensations, qualités, lieux, créatures, gestes et aventures.'},
{cat:'elements',title:'Voir l’invisible par ses traces',text:'Observer le vent sans le voir directement : feuilles, cheveux, nuages, sons et mouvements révèlent son passage.',note:'Fiche proposée pour l’Air.',more:'Très bon pont pédagogique entre visible et invisible : on part d’effets observables avant d’introduire symbole et imaginaire.'},
{cat:'alchimie',title:'Pensée → sentiment → parole → action',text:'Suivre comment une impulsion intérieure devient une manière de regarder, de parler puis d’agir.',more:'Une piste pour montrer que la magie du grimoire commence dans la transformation de la vie intérieure.'},
{cat:'alchimie',title:'Un nuage n’est pas le ciel',text:'Lorsqu’une émotion difficile arrive, l’observer comme quelque chose qui traverse plutôt que comme toute notre identité.',note:'Adaptation d’un exercice de transformation des états négatifs.',more:'Formulation possible : « J’ai une colère » plutôt que « je suis la colère ». L’exercice ne remplace jamais l’aide d’un adulte lorsqu’elle est nécessaire.'},
{cat:'contes',title:'Le héros et l’objet magique',text:'Idée de récit : un objet merveilleux reste inerte tant que le héros n’a pas appris la reconnaissance, la gratitude et le respect.',more:'L’objet devient alors un révélateur : il ne donne pas la magie, il répond à une qualité que le héros a développée.'},
{cat:'sources',title:'Exercices Aïvanhov — matière première',text:'Les notes contiennent de nombreux exercices quotidiens : réveil, gratitude, marche, repas, mains, regard, nature, observation des pensées et transformation des habitudes.',note:'Ils sont désormais classés en adaptable, à transformer ou adulte/archive.',more:'Les pratiques risquées, médicales, de jeûne ou de respiration contraignante restent en archive et ne sont pas proposées comme exercices jeunesse.'},
{cat:'sources',title:'Matière à classer',text:'Notes Drive, conférences, rituels, exercices, contes, citations de travail et pistes de dessins restent conservés ici avant adaptation.',more:'Cette zone gardera la matière brute afin qu’aucune idée ne soit perdue pendant l’écriture.'}
];
const categoryEl=document.getElementById('categories'),cardsEl=document.getElementById('cards'),searchEl=document.getElementById('search'),showAll=document.getElementById('showAll'),heading=document.getElementById('sectionHeading'),status=document.getElementById('status'),results=document.getElementById('results');
let active='all';
function labelFor(id){const c=categories.find(function(x){return x[0]===id});return c?c[2]:id}
function selectCategory(id,button){active=id;document.querySelectorAll('.category').forEach(function(x){x.classList.toggle('active',x===button)});render();results.classList.remove('pulse');void results.offsetWidth;results.classList.add('pulse');setTimeout(function(){results.scrollIntoView({behavior:'smooth',block:'start'})},60)}
categories.forEach(function(c){const b=document.createElement('button');b.type='button';b.className='category';b.setAttribute('aria-pressed','false');b.innerHTML='<span class="icon">'+c[1]+'</span>'+c[2]+'<span class="small">ouvrir</span>';b.addEventListener('click',function(){document.querySelectorAll('.category').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');selectCategory(c[0],b)});categoryEl.appendChild(b)});
function render(){const q=searchEl.value.trim().toLowerCase();const filtered=entries.filter(function(e){return(active==='all'||e.cat===active)&&((e.title+' '+e.text+' '+(e.note||'')+' '+(e.more||'')).toLowerCase().indexOf(q)!==-1)}).sort(function(a,b){if(active==='parcours')return(a.level||99)-(b.level||99);return 0});heading.textContent=active==='all'?'Toutes les fiches':labelFor(active);status.textContent=filtered.length+' fiche'+(filtered.length>1?'s':'')+' affichée'+(filtered.length>1?'s':'')+(q?' pour « '+searchEl.value.trim()+' »':'');cardsEl.innerHTML='';if(!filtered.length){cardsEl.innerHTML='<article class="card"><h3>Aucune fiche trouvée</h3><p>Essaie un autre mot ou affiche toutes les catégories.</p></article>';return}filtered.forEach(function(e){const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-expanded','false');card.innerHTML='<span class="tag">'+labelFor(e.cat)+'</span>'+(e.level?'<p class="level">Niveau '+e.level+' / 10</p>':'')+'<h3>'+e.title+'</h3><p>'+e.text+'</p>'+(e.note?'<p class="note">'+e.note+'</p>':'')+'<p class="openhint">Toucher pour ouvrir ↓</p><div class="details"><strong>À développer dans le livre</strong><p>'+e.more+'</p></div>';function toggle(){const open=card.classList.toggle('open');card.setAttribute('aria-expanded',open?'true':'false')}card.addEventListener('click',toggle);card.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle()}});cardsEl.appendChild(card)})}
searchEl.addEventListener('input',render);showAll.addEventListener('click',function(){active='all';document.querySelectorAll('.category').forEach(function(x){x.classList.remove('active');x.setAttribute('aria-pressed','false')});render()});render();
})();
</script>
</body>
</html>
